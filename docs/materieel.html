<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=block" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materieel - DEFENSIEBRANDWEER NL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;700&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/scrollbar.js"></script>
    <style>
        .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:28px; }
        .material-overview .card { display:block; overflow:hidden; color:var(--text); text-decoration:none; background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--blue); border-radius:6px; transition:border-color 150ms; }
        .material-overview .card:hover { color:var(--text); border-color:var(--gold); }
        .material-overview .card .img { display:block; position:relative; width:100%; aspect-ratio:4/3; overflow:hidden; background:var(--olive); }
        .material-overview .card .img img { display:block; width:100%; height:100%; object-fit:cover; transition:transform 180ms ease; }
        .material-overview .card:hover .img img { transform:scale(1.025); }
        .material-overview .card .num { right:12px; bottom:12px; padding:6px 9px; border:1px solid rgba(240,174,74,.45); border-radius:3px; color:var(--text); background:rgba(12,14,9,.86); font:600 13px 'Barlow',sans-serif; }
        .material-overview .card .num i { color:var(--gold); }
        .material-overview .card .body { display:flex; flex-direction:column; gap:9px; padding:20px 22px 22px; }
        .material-overview .card .cat { color:var(--gold); font:700 13px 'Barlow Condensed',sans-serif; letter-spacing:.12em; text-transform:uppercase; }
        .material-overview .card h3 { color:var(--text); font:700 28px/1.05 'Barlow Condensed',sans-serif; text-transform:uppercase; }
        .material-overview .card:hover h3 { color:#FFD078; }
        .material-overview .card p { min-height:46px; color:var(--text-muted); font:400 15px/1.55 'Barlow',sans-serif; }
        .material-overview .card .meta { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px; padding-top:14px; border-top:1px solid var(--border); }
        .material-overview .card .date { display:inline-flex; align-items:center; gap:10px; padding:0; color:var(--text-soft); background:transparent; font:600 14px 'Barlow',sans-serif; }
        .material-overview .card .date i { color:var(--gold); }
        .material-overview .card .go { display:flex; flex:0 0 44px; align-items:center; justify-content:center; width:44px; height:44px; color:var(--gold); background:transparent; border:1px solid var(--border); border-radius:4px; transition:background-color 150ms,border-color 150ms,color 150ms; }
        .material-overview .card:hover .go { color:var(--text); background:var(--olive); border-color:var(--gold); }
        .material-overview .card .go i { transition:transform 150ms; }
        .material-overview .card:hover .go i { transform:rotate(-45deg); }
        .grid > .card:not(.material-skeleton) { animation:material-fade .35s ease both; }
        @keyframes material-fade { from { opacity:0; } to { opacity:1; } }
        .material-skeleton { min-height:470px; pointer-events:none; }
        .material-skeleton-image { display:block; width:100%; aspect-ratio:4/3; background:var(--olive); }
        .material-skeleton-copy { display:flex; flex-direction:column; gap:9px; padding:20px 22px 22px; }
        .material-skeleton-line { display:block; height:15px; border-radius:3px; background:var(--olive); }
        .material-skeleton-line.category { width:34%; height:12px; }
        .material-skeleton-line.title { width:76%; height:30px; }
        .material-skeleton-line.description { width:100%; height:18px; }
        .material-skeleton-line.description.short { width:68%; }
        .material-skeleton-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px; padding-top:14px; border-top:1px solid var(--border); }
        .material-skeleton-date { display:block !important; width:136px; height:14px; border-radius:3px; background:var(--olive); }
        .material-skeleton-arrow { width:44px; height:44px; flex:0 0 44px; border:1px solid var(--border); border-radius:4px; background:var(--olive); }
        .material-skeleton-image,.material-skeleton-line,.material-skeleton-date,.material-skeleton-arrow,.category-skeleton { position:relative; overflow:hidden; }
        .material-skeleton-image::after,.material-skeleton-line::after,.material-skeleton-date::after,.material-skeleton-arrow::after,.category-skeleton::after { position:absolute; inset:0; content:""; transform:translateX(-100%); background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent); animation:material-shimmer 1.4s infinite; }
        .category-skeleton { display:inline-block; width:106px; height:42px; border-radius:4px; background:var(--olive); }
        @keyframes material-shimmer { to { transform:translateX(100%); } }
        .empty { color:var(--text-muted); padding:48px 20px; text-align:center; }
        .empty i { color:var(--gold); font-size:36px; }
        .empty h3 { color:var(--text); font:700 22px 'Barlow Condensed',sans-serif; text-transform:uppercase; margin:12px 0 6px; }
        .empty p { color:var(--text-soft); font-size:14px; margin:0 0 16px; }
        .empty button { min-height:44px; padding:9px 16px; color:#000; background:var(--gold); border:1px solid var(--gold); border-radius:4px; font:600 15px 'Barlow',sans-serif; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; line-height:1; }
        .empty button i, .empty button .fas, .empty button .fa-solid { font-size:14px; line-height:1; color:#000; display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; margin:0; }
        .empty button i::before, .empty button .fas::before, .empty button .fa-solid::before { line-height:1; margin:0; display:block; }
        .empty button:hover { color:#000; background:#FFD078; border-color:#FFD078; }
        @media(max-width:1024px) { .page { padding:116px 32px 72px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .toolbar { gap:12px; } }
        @media(max-width:640px) { .page { padding:112px 20px 60px; } .page h1 { font-size:46px; } .sub { font-size:17px; margin-bottom:32px; } .toolbar { align-items:stretch; } .search { width:100%; } .cats { width:100%; } .cats button { flex:0 1 auto; } .count { width:100%; margin:0; } .grid { grid-template-columns:1fr; gap:16px; } }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <meta property="og:image" content="https://defensiebrandweer.nl/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body class="material-overview">
<div id="navbar-placeholder"></div>
<div class="scroll-container"><div class="scroll-content">
<div class="page">
    <div class="kicker">Collectie — Defensiebrandweer</div>
    <h1>Materieel</h1>
    <p class="sub">Blusmaterieel, voertuigen en uitrusting. Zoek op naam, categorie of leverancier.</p>
    <div class="toolbar">
        <label class="search"><i class="fi fi-rr-search"></i><input type="text" id="searchInput" placeholder="Zoeken..."></label>
        <div class="cats" id="categoryFilters">
            <button data-filter="all" class="active">Alles</button>
        </div>
        <span class="count" id="resultsCount"><span class="material-skeleton-line" style="display:inline-block;width:84px;height:14px" aria-hidden="true"></span></span>
    </div>
    <div class="grid" id="equipmentGrid" aria-label="Materieel wordt geladen" aria-busy="true"><div class="card material-skeleton" aria-hidden="true"><span class="img material-skeleton-image"></span><div class="body material-skeleton-copy"><span class="material-skeleton-line category"></span><span class="material-skeleton-line title"></span><span class="material-skeleton-line description"></span><span class="material-skeleton-line description short"></span><div class="material-skeleton-meta"><span class="date material-skeleton-date"></span><span class="material-skeleton-arrow"></span></div></div></div><div class="card material-skeleton" aria-hidden="true"><span class="img material-skeleton-image"></span><div class="body material-skeleton-copy"><span class="material-skeleton-line category"></span><span class="material-skeleton-line title"></span><span class="material-skeleton-line description"></span><span class="material-skeleton-line description short"></span><div class="material-skeleton-meta"><span class="date material-skeleton-date"></span><span class="material-skeleton-arrow"></span></div></div></div><div class="card material-skeleton" aria-hidden="true"><span class="img material-skeleton-image"></span><div class="body material-skeleton-copy"><span class="material-skeleton-line category"></span><span class="material-skeleton-line title"></span><span class="material-skeleton-line description"></span><span class="material-skeleton-line description short"></span><div class="material-skeleton-meta"><span class="date material-skeleton-date"></span><span class="material-skeleton-arrow"></span></div></div></div></div>
    <div class="empty" id="noResults" style="display:none;">
        <i class="fa-solid fa-fire-extinguisher"></i>
        <h3>Niets gevonden</h3>
        <p>Pas je zoekopdracht of categorie aan.</p>
        <button id="resetFiltersBtn"><i class="fas fa-rotate-left"></i> Reset filters</button>
    </div>
</div>
<div id="footer-placeholder"></div>
</div><div class="custom-scrollbar-body"><div class="scrollbar-thumb"></div></div></div>
<script>
    const API_BASE_URL = '/api';
    const MIN_SKELETON_TIME = 650;
    const loadingStartedAt = performance.now();
    let allEquipment = [], allLicenseplates = [];
    let activeFilter = 'all', searchTerm = '', activeCategory = 'all';
    const grid = document.getElementById('equipmentGrid'), noResults = document.getElementById('noResults'),
        searchInput = document.getElementById('searchInput'), resultsCount = document.getElementById('resultsCount'),
        resetBtn = document.getElementById('resetFiltersBtn'), catsBox = document.getElementById('categoryFilters');

    async function fetchEquipment() {
        try {
            const [eqRes, platesRes] = await Promise.all([
                fetch(`${API_BASE_URL}/equipment`),
                fetch(`${API_BASE_URL}/licenseplates`)
            ]);
            if (!eqRes.ok) throw new Error('API error');
            if (platesRes.ok) allLicenseplates = await platesRes.json();
            return await eqRes.json();
        } catch (e) { return []; }
    }

    function applyFilters() {
        const q = searchTerm.toLowerCase();
        const f = allEquipment.filter(e => {
            if (activeCategory !== 'all' && e.category !== activeCategory) return false;
            if (q) {
                const hay = [e.name, e.category, e.description, e.leverancier].filter(Boolean).join(' ').toLowerCase();
                if (!hay.includes(q)) return false;
            }
            return true;
        });
        render(f);
        resultsCount.textContent = `${f.length} ${f.length === 1 ? 'item' : 'items'}`;
    }

    function render(list) {
        if (!list.length) { grid.style.display = 'none'; noResults.style.display = 'block'; return; }
        grid.style.display = 'grid'; noResults.style.display = 'none';
        grid.innerHTML = list.map(e => {
            const img = e.imageUrl || 'https://images.unsplash.com/photo-1582131503261-fca1c9bcec44?auto=format&fit=crop&q=80&w=800';
            const title = e.name || 'Onbekend materieel';
            return `<a class="card" href="materieel-detail?id=${encodeURIComponent(e.id || '')}">
                <div class="img"><img src="${img}" alt="" onerror="this.src='https://images.unsplash.com/photo-1582131503261-fca1c9bcec44?auto=format&fit=crop&q=80&w=800'"></div>
                <div class="body">
                    <div class="cat">${e.category || 'Materieel'}</div>
                    <h3>${title}</h3>
                    <p>${e.description || ''}</p>
                    <div class="meta"><span class="date"><i class="fi fi-rr-calendar"></i>${e.year || '—'}</span><span class="go"><i class="fi fi-rr-arrow-right"></i></span></div>
                </div></a>`;
        }).join('');
        grid.removeAttribute('aria-label');
        grid.removeAttribute('aria-busy');
    }

    function renderCategoryFilters() {
        const cats = [...new Set(allEquipment.map(e => e.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'nl'));
        catsBox.innerHTML = `<button data-filter="all" class="${activeCategory === 'all' ? 'active' : ''}">Alles</button>`
            + cats.map(c => `<button data-filter="${c.replace(/"/g, '&quot;')}" class="${activeCategory === c ? 'active' : ''}">${c}</button>`).join('');
        catsBox.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
            catsBox.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
            activeCategory = b.dataset.filter;
            applyFilters();
        }));
    }

    let t;
    searchInput.addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { searchTerm = e.target.value; applyFilters(); }, 250); });
    resetBtn.addEventListener('click', () => {
        searchInput.value = ''; searchTerm = ''; activeCategory = 'all';
        catsBox.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.filter === 'all'));
        applyFilters();
    });
    document.addEventListener('DOMContentLoaded', async () => {
        allEquipment = await fetchEquipment();
        renderCategoryFilters();
        const elapsed = performance.now() - loadingStartedAt;
        if (elapsed < MIN_SKELETON_TIME) await new Promise(r => setTimeout(r, MIN_SKELETON_TIME - elapsed));
        applyFilters();
    });
</script>
</body>
</html>
